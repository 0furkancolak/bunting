name: Release

# Push a tag such as v0.1.0 to publish the NuGet packages, the container images and a GitHub release.
on:
  push:
    tags: ['v*']

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Tag '$tag' is not vMAJOR.MINOR.PATCH[-suffix]"; exit 1; }
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet restore Bunting.sln
      - run: dotnet build Bunting.sln -c Release --no-restore
      - run: dotnet test --solution Bunting.sln -c Release --no-build

  packages:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack
        run: |
          for project in Bunting.Domain Bunting.Evaluation Bunting.Sdk; do
            dotnet pack "src/$project" -c Release -o artifacts -p:Version=${{ needs.verify.outputs.version }} -p:ContinuousIntegrationBuild=true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then echo "NUGET_API_KEY is not set; skipping the push"; exit 0; fi
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --generate-notes

  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [server, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bunting-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Bunting.${{ matrix.image == 'server' && 'Server' || 'Admin' }}/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.name }}:${{ needs.verify.outputs.version }}
            ${{ steps.name.outputs.name }}:latest
